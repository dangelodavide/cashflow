<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Investimenti</title>
    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
        crossorigin="anonymous"
    />
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="cashflow.html">Cashflow</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarOptions"
                aria-controls="navbarOptions"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarOptions">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="cashflow.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="investments.html">Gestione Investimenti</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="investment-section">
            <div class="investment-title">
                GESTIONE INVESTIMENTI
            </div>            
            <div class="investment-content">
                <div class="sort-options-container">
                    <label for="sortOptions">Ordina per:</label>
                    <select id="sortOptions" onchange="sortInvestmentData()">
                        <option value="date-asc">Data Ricavo (Anno) Ascendente</option>
                        <option value="date-desc">Data Ricavo (Anno) Discendente</option>
                        <option value="description-asc">Descrizione (A-Z)</option>
                        <option value="description-desc">Descrizione (Z-A)</option>
                        <option value="cost-asc">Costo Investimento (Min-Max)</option>
                        <option value="cost-desc">Costo Investimento (Max-Min)</option>
                        <option value="return-asc">Ricavo Atteso (Min-Max)</option>
                        <option value="return-desc">Ricavo Atteso (Max-Min)</option>
                    </select>
                </div>
                <table id="investmentTable" class="investment-table">
                    <tr>
                        <th>Descrizione</th>
                        <th>Costo Investimento</th>
                        <th>Ricavo Atteso</th>
                        <th>Data Ricavo</th>
                    </tr>
                </table>                         
                <button class="add-btn" onclick="addInvestment()">Aggiungi</button>
                <div style="display: flex; gap: 20px; justify-content: center; margin-top: 15px;">
                    <div class="totals-investment">Totale Investito: €<span id="totaleInvestito">0</span></div>
                    <div class="totals-investment">Ricavo Atteso: €<span id="ricavoAttesoTotale">0</span></div>
                    <div class="totals-investment">Prelievo Atteso: €<span id="prelievoAtteso">0</span></div>
                </div>
                <div id="annualReturns" class="annual-returns"></div>
            </div>  
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
